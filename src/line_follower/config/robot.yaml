# Real robot (Jetson Orin Nano, Ubuntu 24.04, Jazzy): rule.yaml minus sim time and the
# track-specific speed_profile. Same perception settings as the evaluated V0-NearRule640.
/**:
  ros__parameters:
    use_sim_time: false
follower_node:
  ros__parameters:
    perception: rule      # rule | dl
    controller: rule      # rule | learned
    v_max: 0.12           # first real runs (docs/REAL_ROBOT_TEST.md); control team raises it. Motor no-load top ~0.24 m/s at 11.1 V
    v_min: 0.06
    a_lat: 0.25
    a_dec: 0.3
    a_acc: 0.6
    v_hill: 0.30
    omega_max: 3.0
    lookahead_min: 0.10
    lookahead_gain: 0.30
    finish_min_dist: 14.0
    debug_image: true      # /line_follower/debug for checking detection on the robot
    restore_model: ''      # restoration off (hurt the official track)
    # Ramp handling with the IMU (adopted 2026-11-25, docs/OPEN_SOURCE_SURVEY.md 5-9):
    # never-pass case maps 5.4 % -> 16.7 % per run (Fisher p = 0.003), no regression on the
    # 251 always-pass maps, official track 8/8, hills60 subset 0/24 -> 2/24 (progress +56 %).
    imu_slip: true          # encoder vs IMU speed: ignore wheel spin ...
    imu_slip_rate: 0.3      # ... only while the body tips over a crest (|pitch rate| > 0.3 rad/s)
    imu_floor: true         # project onto the floor tracked with the IMU while on/near a ramp
    deck_xfar: 0.45         # on a raised deck only trust the near ground
